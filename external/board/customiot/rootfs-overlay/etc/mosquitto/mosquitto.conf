# CustomIoT Linux MQTT Broker
# Module 04

listener 1883 127.0.0.1

# Laboratory configuration:
# Only processes inside this guest can connect.
allow_anonymous true

# Disable persistent message storage for now.
persistence false

# Log through standard error.
log_dest stderr

# MQTT message limits
max_inflight_messages 20

# Disable retained-message persistence.
# Persistent storage will be configured later.
