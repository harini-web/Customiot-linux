# CustomIoT Linux Configuration

SYSTEM_NAME="CustomIoT Linux"
SYSTEM_VERSION="0.3"

# Gateway configuration
GATEWAY_NAME="customiot-gateway"
GATEWAY_ENABLED="no"

# Sensor configuration
SENSOR_MODE="uart"
SENSOR_INTERVAL="1"

# MQTT configuration
MQTT_HOST="127.0.0.1"
MQTT_PORT="1883"
MQTT_TOPIC="customiot/sensors/temperature"

# Logging
LOG_LEVEL="info"
LOG_DIR="/var/log"
SENSOR_DEVICE="/dev/ttyS1"
